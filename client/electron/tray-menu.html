<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .tray-card {
      background: #1c1c1e;
      border: none;
      outline: none;
      border-radius: 12px;
      box-shadow: none;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin: 0;
      width: 100%;
      height: 100%;
    }

    .menu-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 400;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.1s;
      white-space: nowrap;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    .menu-item:active {
      background: rgba(255, 255, 255, 0.16);
    }
  </style>
</head>
<body>
  <div class="tray-card" id="card">
    <div class="menu-item" id="btn-open">Open Ethernet</div>
    <div class="menu-item" id="btn-toggle-notifs">Disable notifications</div>
    <div class="menu-item" id="btn-quit">Quit Ethernet</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const btnOpen = document.getElementById('btn-open');
    const btnToggleNotifs = document.getElementById('btn-toggle-notifs');
    const btnQuit = document.getElementById('btn-quit');

    ipcRenderer.on('tray:set-state', (_e, { notificationsDisabled }) => {
      btnToggleNotifs.textContent = notificationsDisabled ? 'Enable notifications' : 'Disable notifications';
    });

    btnOpen.addEventListener('click', () => {
      ipcRenderer.send('tray:action-open');
    });

    btnToggleNotifs.addEventListener('click', () => {
      ipcRenderer.send('tray:action-toggle-notifs');
    });

    btnQuit.addEventListener('click', () => {
      ipcRenderer.send('tray:action-quit');
    });
  </script>
</body>
</html>
